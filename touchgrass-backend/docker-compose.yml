# docker-compose.yml
version: '3.8'

services:
  postgres-test:
    image: postgres:15
    container_name: touchgrass_postgres_test
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: touchgrass_test
    ports:
      - '5433:5432'  # map container port 5432 to host 5433
    volumes:
      - pgdata_test:/var/lib/postgresql/data

volumes:
  pgdata_test: